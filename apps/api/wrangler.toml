name = "schoolquest-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Wrangler v4 collects anonymous telemetry and prompts about it on first run. A student who
# double-clicked the desktop shortcut should not meet a data-collection question in a black
# window, so it is turned off here rather than left to a per-machine prompt.
send_metrics = false

# Free-tier configuration: D1 and R2 only. No Queues — syllabus extraction runs inline
# via ctx.waitUntil(). Swap JobRunner for a Queues producer when moving to the paid plan;
# see src/jobs/runner.ts.

[[d1_databases]]
binding = "DB"
database_name = "schoolquest"
# Replace with the id printed by: wrangler d1 create schoolquest
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "schoolquest-documents"

[vars]
APP_NAME = "SchoolQuest"
# Public origin of the web app; magic links point here and CORS is restricted to it.
APP_URL = "http://localhost:5173"
# NOTE: OPENROUTER_COACH_MODEL and OPENROUTER_EXTRACTION_MODEL are intentionally NOT set here.
# Pinning a model id defeats the whole point of reading OpenRouter's live catalogue: the pin
# goes stale the day the provider renames or retires that model, and then every call fails with
# "this model is deprecated" while the app has no way to heal itself. Left unset, the coach,
# guard and extraction default all follow the live, recency-filtered catalogue
# (packages/ai/src/catalog.ts). Set these two only for a deployment that must pin one for policy
# reasons, and expect to update them by hand when the provider moves on.

# Secrets — set with `wrangler secret put <NAME>`, never in this file:
#   OPENROUTER_API_KEY   required, from https://openrouter.ai/keys
#   AUTH_SECRET          required, HMAC key for magic-link tokens (openssl rand -hex 32)
#   RESEND_API_KEY       optional; without it, no sign-in emails are sent
#
# DEV_MODE is never set here. The dev scripts pass `--var DEV_MODE:true` to `wrangler dev`, and
# that flag alone is what returns sign-in links on screen and allows a client-chosen clock.

[observability]
enabled = true
