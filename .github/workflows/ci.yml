name: CI

# Every push and pull request. The Windows installer workflow runs the same unit checks, but
# only on a tag, so until this existed a commit to main was never checked by anything -- and
# the one screen a student uses had no test that rendered it. The acceptance journey drives
# the release list (docs/02-prd.md §7) through a real browser against the real Worker.

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run's answer moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # No version here: package.json's `packageManager` field pins it, and the action refuses
      # to be told twice.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, unit tests
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      # The same tests, with the machine's clock west and east of Greenwich. Every time inside
      # the app is UTC and only the screens convert (issue #4); a mistake between the two is
      # invisible at UTC+0, which is where CI runs, so this is where it shows.
      - name: Unit tests in other time zones
        run: |
          TZ=America/Los_Angeles pnpm test
          TZ=Asia/Tokyo pnpm test

      # Wall-clock ceilings on the planner and the radar, timed alone rather than beside the
      # whole parallel suite, which is what made them fail on unchanged code (issue #30).
      - name: CPU ceilings
        run: pnpm test:bench

      # A fresh local database and secrets file, exactly as a first run makes them.
      - name: Set up a local install
        run: pnpm run setup

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      # Starts both halves itself, walks the journey, stops them. Fails the job on any step.
      - name: Acceptance journey
        run: pnpm test:acceptance

      # Does every assignment coming due get time? A normal week, the week after, a skipped
      # block, "needs more time", a student outside UTC, and an oversubscribed week.
      - name: Scheduling journey
        run: pnpm test:scheduling

      # A new student through the browser: onboarding, key, calendar, courses, a .docx syllabus
      # read by the app's own reader, review, confirm, plan. The model is a mock serving the
      # committed semester4 extractions; everything else is the real path.
      - name: Intake journey
        run: pnpm test:intake

      # Three weeks on the simulated clock: a Thursday lost to the same shift twice becomes a
      # review question, then a standing commitment the plan stops booking over. Then the term
      # is archived and reopened with all of its work.
      - name: Multi-week journey
        run: pnpm test:weeks

      # Each setting changed on Setup and followed into the plan: the key, the reader, study
      # hours, meals and the term. Saved is not enough; the replanned week has to honour it.
      - name: Settings journey
        run: pnpm test:settings

      # WCAG AA on every rendered screen, per theme. The servers are started once for all
      # three runs; the walker signs in on its own.
      # The contrast walker measures what is on screen, so it needs an account with something
      # on it. Against a fresh account every tab is the onboarding card (about 11 text nodes),
      # and the walk passed while checking almost nothing. The demo seed is a full
      # semester; it only replaces its own user, so the journeys above are unaffected.
      - name: Seed the demo semester for the contrast checks
        run: pnpm db:seed:local

      - name: Start the app for the contrast checks
        run: |
          nohup node tools/dev.mjs > /tmp/dev.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:5173/ > /dev/null && curl -s http://127.0.0.1:8787/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "servers did not start"; tail -50 /tmp/dev.log; exit 1

      # Signed in as the seeded student, on a day inside the seed's fixed term (it ends
      # 2026-11-06; on the real clock the screens would empty out again once it is over). A
      # tab drawing fewer than 15 text nodes fails the run instead of passing unmeasured.
      - name: Contrast (plain, quest, mission)
        env:
          SQ_EMAIL: demo@schoolquest.local
          SQ_NOW: "2026-09-16T14:00:00.000Z"
          SQ_MIN_NODES: "15"
        run: |
          node tools/e2e/contrast.mjs plain
          node tools/e2e/contrast.mjs quest
          node tools/e2e/contrast.mjs mission
