name: Windows installer

# Builds the desktop shell into a Windows installer.
#
# It runs on a real Windows runner rather than cross-compiling, because the Tauri Windows
# bundle needs MSVC, WebView2 and either NSIS or WiX, and every one of those is a different
# way for a cross-build to produce something that installs but does not run. A native build
# is the one that has actually been on Windows before a student has.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      apiUrl:
        description: >
          Worker origin the installed app should talk to, e.g.
          https://schoolquest-api.example.workers.dev. Leave blank to build against a
          same-origin API, which only makes sense if you are serving the two together.
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    # Lifted to the job so the signing steps can be skipped with `if: env.… != ''`. A step's own
    # `env:` is not readable by its own `if:`, and the certificate is deliberately optional —
    # the repository has to build without one until a certificate is actually bought.
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}

    steps:
      - uses: actions/checkout@v4

      # No version here: package.json's `packageManager` field pins it, and the action refuses
      # to be told twice.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Keyed on the lockfile so a dependency bump busts it and an ordinary commit does not.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The gates the repo already holds itself to. A signed installer of a broken build is
      # worse than no installer, because it looks finished.
      - name: Check
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      # A tag push carries no workflow inputs, so a release built on the input alone would ship
      # with no API origin at all — an installer that starts, looks fine, and fails every
      # request. The repository variable is what makes the tagged path work unattended.
      - name: Resolve the API origin
        id: api
        shell: bash
        run: |
          url="${{ github.event.inputs.apiUrl }}"
          [ -n "$url" ] || url="${{ vars.SCHOOLQUEST_API_URL }}"
          if [ -z "$url" ]; then
            echo "::error::No API origin. Set the SCHOOLQUEST_API_URL repository variable, or"\
                 " pass apiUrl when running this workflow by hand. A packaged build loads from"\
                 " tauri://localhost, so a blank value means every request goes nowhere."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Building against $url"

      # The version lives in four files and the tag is a fifth claim about it. When they disagree
      # the build still succeeds and publishes `SchoolQuest_0.1.0_x64-setup.exe` under a v0.2.0
      # release, which Windows then treats as a repair of the installed version rather than an
      # upgrade. Cheaper to refuse the tag than to explain that to a student.
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node tools/version.mjs check "${GITHUB_REF_NAME}"

      # Unsigned, Windows SmartScreen shows "Windows protected your PC" and hides the Run button
      # behind "More info" — for a student that is where the install ends. Signing is therefore
      # the single highest-value thing here, and also the one thing that cannot be done without
      # buying something, so it is wired up and inert: with no WINDOWS_CERTIFICATE secret the
      # build is exactly the unsigned build it was before.
      #
      # WINDOWS_CERTIFICATE is the .pfx base64-encoded; WINDOWS_CERTIFICATE_PASSWORD its password.
      # Tauri signs by thumbprint against the machine's certificate store rather than by file, so
      # the certificate has to be imported before the build and removed after it.
      - name: Import the code-signing certificate
        id: cert
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx -Force
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          Write-Host "Signing as $($cert.Subject), expires $($cert.NotAfter.ToString('yyyy-MM-dd'))"

      - name: Build the installer
        working-directory: apps/desktop
        shell: bash
        env:
          # Vite inlines this at build time, so the installer is bound to one Worker origin.
          VITE_API_URL: ${{ steps.api.outputs.url }}
          THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
        run: |
          args=(--api-url "$VITE_API_URL")
          # Empty when no certificate was imported, which leaves the overlay free of signing keys
          # rather than passing an empty thumbprint the bundler would fail on. Spelled as an `if`
          # rather than `[ … ] && …` because the short form's exit status is the shell's under
          # `set -e`, and whether that ends the step depends on the bash version on the runner.
          if [ -n "$THUMBPRINT" ]; then
            args+=(--thumbprint "$THUMBPRINT")
          fi
          overlay="$(node scripts/build-config.mjs "${args[@]}")"
          echo "Config overlay: $overlay"
          pnpm tauri build --config "$overlay"

      # The certificate outlives the job otherwise only in theory — runners are ephemeral — but
      # `always()` keeps a failed build from being the reason a private key sits in a store.
      - name: Remove the certificate
        if: always() && steps.cert.outputs.thumbprint != ''
        shell: pwsh
        run: Remove-Item -Path "Cert:\CurrentUser\My\${{ steps.cert.outputs.thumbprint }}" -DeleteKey -Force

      - name: Collect the installers
        uses: actions/upload-artifact@v4
        with:
          name: schoolquest-windows
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi

      # Only on a tag: a manual run is for trying a build, not for publishing one.
      #
      # The release page is the first thing a student sees, and by default it is a list of two
      # files with no indication which one they want — an .msi that asks for an administrator
      # password most students do not have, next to the .exe that does not. The body says which,
      # in the two sentences someone reads before clicking.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            **Installing on Windows:** download the file ending in **`-setup.exe`** and open it.
            It installs for you only and never asks for an administrator password.

            Windows may say *"Windows protected your PC"*. Click **More info**, then
            **Run anyway** — that warning is about the installer not being signed yet, not about
            anything being wrong with it.

            Full instructions, including how to sign in and how to uninstall:
            [docs/11-installing-on-windows.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/11-installing-on-windows.md)

            The `.msi` is for university IT deploying SchoolQuest by group policy; it requires
            administrator rights and most people should ignore it.
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
